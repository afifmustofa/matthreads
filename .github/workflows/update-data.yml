name: Update data Threads

on:
  schedule:
    - cron: "17 */6 * * *"   # tiap 6 jam (UTC)
  workflow_dispatch:          # bisa dijalankan manual dari tab Actions

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ambil data dari Threads API
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          LOOKBACK_DAYS: ${{ vars.LOOKBACK_DAYS || '90' }}
          MAX_POSTS: ${{ vars.MAX_POSTS || '300' }}
        run: python scripts/fetch_threads.py

      - name: Commit data terbaru
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/threads.json
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data."
          else
            git commit -m "data: update $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
